{% extends "animation/base.html" %}

{% block title %}Password updated{% endblock %}
{% block body_class %}anim-page anim-page--auth{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <p class="auth-card__eyebrow">AnimStudio</p>
        <h1 class="auth-card__title">Password updated</h1>
        <p class="auth-card__subtitle">You can now sign in with your new password.</p>

        <div class="auth-links">
            <a href="{% url 'account_login' %}">Go to log in</a>
        </div>
    </div>
</section>
{% endblock %}
