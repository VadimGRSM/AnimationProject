{% load static %}
<!DOCTYPE html>
<html lang="ru" data-current-user-id="{% if user.is_authenticated %}{{ user.id }}{% endif %}">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AnimStudio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'animation/style.css' %}">
    <script>
        const currentUserIdRaw = document.documentElement.dataset.currentUserId || '';
        window.CURRENT_USER_ID = currentUserIdRaw ? Number(currentUserIdRaw) : null;
        window.I18N_URL = "{% static 'animation/i18n.json' %}?v=20260211";
    </script>
    <script src="{% static 'animation/i18n.js' %}?v=20260211" defer></script>
</head>
<body>
<header>
    <h1>AnimStudio</h1>
    {% if user.is_authenticated %}
        <p>
            <span data-i18n="logged_in_as">Вы вошли как</span> {{ user.username }}
            | <a href="{% url 'logout' %}" data-i18n="log_out">Выйти</a>
        </p>
    {% else %}
        <p>
            <a href="{% url 'login' %}" data-i18n="log_in">Войти</a>
        </p>
    {% endif %}
    <p class="language-picker">
        <label>
            <span data-i18n="language">Язык</span>
            <select id="language-select">
                <option value="ru" data-i18n="russian">Русский</option>
                <option value="uk" data-i18n="ukrainian">Українська</option>
                <option value="en" data-i18n="english">English</option>
            </select>
        </label>
    </p>
    <hr>
</header>

<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
