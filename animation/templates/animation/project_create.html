{% extends 'animation/base.html' %}

{% block title %}Create project{% endblock %}

{% block content %}
<h2>Create a new project</h2>

<form method="post">
    {% csrf_token %}
    <label>
        Title
        <input type="text" name="title">
    </label>
    <br>
    <label>
        FPS
        <input type="number" name="fps" value="12" min="1" max="60">
    </label>
    <br>
    <label>
        Width
        <input type="number" name="width" value="1280" min="100">
    </label>
    <br>
    <label>
        Height
        <input type="number" name="height" value="720" min="100">
    </label>
    <br>
    <button type="submit">Create</button>
</form>
{% endblock %}
