name: Deploy AnimStudio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "Go to app repo"
            cd ${{ secrets.PROJECT_DIR }}/app

            echo "Fetch latest code"
            git fetch origin

            echo "Reset to target branch"
            git reset --hard origin/${{ secrets.DEPLOY_BRANCH }}

            echo "Go to project root"
            cd ${{ secrets.PROJECT_DIR }}

            echo "Rebuild and restart containers"
            docker compose up -d --build --remove-orphans

            echo "Wait until web container is ready enough for Django commands"
            until docker compose exec -T web python manage.py check >/dev/null 2>&1; do
              echo "Waiting for web/db..."
              sleep 3
            done

            echo "Run migrations"
            docker compose exec -T web python manage.py migrate --noinput

            echo "Collect static"
            docker compose exec -T web python manage.py collectstatic --clear --noinput

            echo "Ensure django.contrib.sites record exists"
            docker compose exec -T web python manage.py shell -c "from django.contrib.sites.models import Site; Site.objects.update_or_create(id=4, defaults={'domain':'www.animstudio.website','name':'AnimStudio'})"

            echo "Run Django check"
            docker compose exec -T web python manage.py check

            echo "Show container status"
            docker compose ps

            echo "Recent logs"
            docker compose logs --tail=50 web db redis || true
